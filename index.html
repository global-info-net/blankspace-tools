<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLANK TEXT GENERATOR - Free Online Copy Paste Tool</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0b0f19; color: #f1f5f9; text-align: center; padding: 20px; }
        .box { max-width: 500px; margin: 40px auto; background: #151d30; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; background: #0b0f19; border: 2px solid #1e293b; border-radius: 6px; color: #fff; padding: 10px; box-sizing: border-box; resize: none; font-size: 1rem; }
        button { background: #38bdf8; color: #0b0f19; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; }
        .ad { background: rgba(255,255,255,0.03); border: 1px dashed #334155; margin: 20px auto; padding: 15px; max-width: 500px; min-height: 90px; color: #475569; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="ad">
        <!-- PASTE ADSTERRA BANNER CODE 1 HERE -->
        [TOP AD ADSTERRA BANNER PLACEHOLDER]
    </div>

    <div class="box">
        <h1>Blank Text Generator</h1>
        <p>Easily create and copy invisible blank spaces for social media bios, nicknames, and chat apps.</p>
        <textarea id="output" readonly>ㅤ</textarea>
        <button onclick="copyBlank()">Copy Invisible Text</button>
    </div>

    <div class="ad">
        <!-- PASTE ADSTERRA BANNER CODE 2 HERE -->
        [BOTTOM AD ADSTERRA BANNER PLACEHOLDER]
    </div>

    <script>
        function copyBlank() {
            var copyText = document.getElementById("output");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("Invisible blank space copied successfully!");
        }
    </script>
</body>
</html>

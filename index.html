    <style>
        body { font-family: system-ui, sans-serif; background: #0b0f19; color: #f1f5f9; text-align: center; padding: 20px; margin: 0; }
        .box { max-width: 500px; margin: 30px auto; background: #151d30; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        button { background: #38bdf8; color: #0b0f19; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; }
        .ad { background: rgba(255,255,255,0.03); border: 1px dashed #334155; margin: 20px auto; padding: 15px; max-width: 500px; min-height: 90px; color: #475569; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .links-grid { max-width: 500px; margin: 20px auto; text-align: left; background: #151d30; padding: 20px; border-radius: 12px; }
        .links-grid h3 { margin-top:0; color:#fff; border-bottom: 1px solid #334155; padding-bottom: 8px;}
        .links-scroll { max-height: 300px; overflow-y: scroll; padding-right: 5px; }

    </style>
</head>
<body>

    <div class="ad">
        <!-- PASTE YOUR MONETAG AD TAG HERE -->
        [TOP MONETAG AD PLACEHOLDER]
    </div>

    <div class="box">
        <h1 id="main-title">Invisible Character Generator</h1>
        <p id="main-desc">Easily create and copy invisible blank spaces for social media bios, nicknames, and chat apps.</p>
        <textarea id="output" readonly>ㅤ</textarea>
        <button onclick="copyBlank()">Copy Invisible Text</button>
    </div>

    <!-- GIANT PROGRAMMATIC LINKS GRID FOR MASSIVE GOOGLE INDEXING -->
    <div class="links-grid">
        <h3 id="grid-title">All Target Platforms</h3>

    <script>
        // MASSIVE PROGRAMMATIC MULTIPLIER (Combines platforms with search prefixes for 1,000s of variants)
        const categories = ["game", "social", "app"];
        
        const platforms = [
            "pubg", "free-fire", "roblox", "tiktok", "instagram", "fortnite", "cod-mobile", 
            "clash-of-clans", "discord", "whatsapp", "telegram", "facebook", "twitter-x", 
            "apex-legends", "minecraft", "valorant", "league-of-legends", "among-us", "snapchat",
            "bgmi", "gta-v", "clash-royale", "brawl-stars", "mobile-legends", "pubg-lite", "free-fire-max",
            "threads", "pinterest", "reddit", "twitch", "kick", "youtube", "skype", "zoom", "teams",
            "steam", "epic-games", "playstation", "xbox", "nintendo", "ea-sports", "efootball"
        ];

        const prefixes = [
            "invisible-name-for", "blank-space-generator-for", "invisible-character-for", 
            "empty-text-copy-paste-for", "hide-name-in", "space-code-for", "blank-bio-text-for", 
            "space-bar-character-for", "hidden-nickname-code-for", "invisible-unicode-for",
            "zero-width-space-for", "blank-name-glitch-for", "invisible-letter-for",
            "empty-status-text-for", "invisible-text-copy-paste-for", "blank-space-code-for"
        ];

        function initMassiveSite() {
            const urlParams = new URLSearchParams(window.location.search);
            let target = urlParams.get('p'); // Reads ?p=invisible-name-for-pubg

            if (!target) {
                target = "invisible-character-generator";
            }

            let cleanName = target.replace(/-/g, ' ');

            // Dynamic SEO updates that Google will crawl and index
            document.title = `${cleanName.toUpperCase()} - 100% Free Copy Paste`;
            document.getElementById("main-title").innerText = cleanName;
            document.getElementById("main-desc").innerText = `Need an updated 2026 trick for ${cleanName}? Tap the button below to generate the functional hidden character code and copy it directly to your clipboard for free.`;

            // AUTOMATICALLY GENERATE HUNDREDS OF INTERNAL LINKS IN THE FOOTER
            const container = document.getElementById("links-container");
            
            // Loops through combinations to create cross-links for the Google Bot
            prefixes.forEach(prefix => {
                platforms.forEach(platform => {
                    let parameterValue = `${prefix}-${platform}`;
                    let linkText = parameterValue.replace(/-/g, ' ').toUpperCase();
                    
                    let a = document.createElement('a');
                    a.href = `?p=${parameterValue}`;
                    a.innerText = `➔ ${linkText}`;
                    container.appendChild(a);
                });
            });
            
            document.getElementById("grid-title").innerText = `Browse All Generated Tools (${container.children.length} Pages Available)`;
        }

        function copyBlank() {
            var copyText = document.getElementById("output");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("Invisible code copied!");
        }

        window.onload = initMassiveSite;
    </script>
</body>
